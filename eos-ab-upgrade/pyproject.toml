[project]
name = "eos-ab-upgrade"
version = "0.1.0"
description = "Decision logic used by an Itential Arista EOS A/B upgrade workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["eos_ab_upgrade*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
